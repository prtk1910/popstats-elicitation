[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popstats-elicitation"
version = "0.1.0"
description = "LLM elicitation of population distributions vs ACS PUMS gold"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
