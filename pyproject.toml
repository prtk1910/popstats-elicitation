[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "popstats-elicitation"
version = "0.1.0"
description = "LLM elicitation of population distributions vs ACS PUMS gold"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "requests>=2.31",
    "jsonschema>=4.22",
    "matplotlib>=3.8",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
